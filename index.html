<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F9FC" />
    <meta
      name="description"
      content="Fontex: acompañamiento académico con evidencia documental."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand/fontex-mark.svg" />
    <script>
      (() => {
        let theme;
        try {
          const stored = localStorage.getItem("fontex-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch {}
        theme ||= matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0B1020" : "#F7F9FC";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <title>Fontex — Fuentes puestas en contexto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
