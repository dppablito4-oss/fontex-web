name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Install browser for canvas verification
        run: npx playwright install --with-deps chromium
      - name: Test real browser canvas flows
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  database-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated Postgres
        run: npx supabase db start
      - name: Test schema and RLS
        run: npx supabase test db --local
      - name: Rehearse isolated database backup and restore
        run: node scripts/check-database-restore.mjs
      - name: Stop isolated Postgres
        if: always()
        run: npx supabase stop --no-backup

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check document processing
        run: deno check --config supabase/functions/document-process/deno.json supabase/functions/document-process/index.ts
      - name: Check document upload and deletion
        run: |
          deno check --config supabase/functions/document-upload/deno.json supabase/functions/document-upload/index.ts
          deno check --config supabase/functions/document-delete/deno.json supabase/functions/document-delete/index.ts
      - name: Test bounded requests and PDF extraction
        run: deno test --node-modules-dir=none supabase/functions/_shared/http_test.ts supabase/functions/_shared/rag/pdf_test.ts supabase/functions/_shared/beta_test.ts
      - name: Check document search
        run: deno check --config supabase/functions/document-search/deno.json supabase/functions/document-search/index.ts
      - name: Check tutor chat
        run: deno check --config supabase/functions/tutor-chat/deno.json supabase/functions/tutor-chat/index.ts
      - name: Check math practice tutor
        run: deno check --config supabase/functions/practice-tutor/deno.json supabase/functions/practice-tutor/index.ts
      - name: Check Studio agent
        run: deno check --config supabase/functions/studio-agent/deno.json supabase/functions/studio-agent/index.ts
      - name: Test composable primitive agent
        run: deno test --allow-env --config supabase/functions/studio-agent/deno.json supabase/functions/studio-agent/primitive-handler_test.ts supabase/functions/studio-agent/credits_test.ts supabase/functions/studio-agent/usage_test.ts supabase/functions/studio-agent/release_test.ts
      - name: Test tutor failures and grounding
        run: deno test --allow-env --config supabase/functions/tutor-chat/deno.json supabase/functions/tutor-chat/handler_test.ts
      - name: Check general scene agent
        run: deno check --config supabase/functions/scene-agent/deno.json supabase/functions/scene-agent/index.ts
      - name: Test general scene generation
        run: deno test --config supabase/functions/scene-agent/deno.json supabase/functions/scene-agent/handler_test.ts
      - name: Lint Edge Functions
        run: deno lint supabase/functions
