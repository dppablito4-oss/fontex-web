name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated Postgres
        run: npx supabase db start
      - name: Test schema and RLS
        run: npx supabase test db --local
      - name: Stop isolated Postgres
        if: always()
        run: npx supabase stop --no-backup

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check document processing
        run: deno check --config supabase/functions/document-process/deno.json supabase/functions/document-process/index.ts
      - name: Check document search
        run: deno check --config supabase/functions/document-search/deno.json supabase/functions/document-search/index.ts
      - name: Check tutor chat
        run: deno check --config supabase/functions/tutor-chat/deno.json supabase/functions/tutor-chat/index.ts
      - name: Lint Edge Functions
        run: deno lint supabase/functions/document-process/index.ts supabase/functions/document-search/index.ts supabase/functions/tutor-chat/index.ts supabase/functions/_shared/rag/*.ts
